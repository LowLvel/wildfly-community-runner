name: Prepare or publish Marketplace update

on:
  workflow_dispatch:
    inputs:
      action:
        description: Prepare a signed candidate, or explicitly upload an update to an existing Marketplace listing
        type: choice
        default: prepare
        options: [prepare, publish-update]

permissions:
  contents: read

concurrency:
  group: marketplace-release
  cancel-in-progress: false

jobs:
  release-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != refs/heads/main ]; then
            echo 'Run releases from main after the reviewed changes have merged.' >&2
            exit 1
          fi

  validate:
    needs: release-ref
    uses: ./.github/workflows/build.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-candidate
          path: build/candidate
      - name: Validate the exact candidate from this run
        run: python3 scripts/release_manifest.py --candidate-directory build/candidate --commit "$GITHUB_SHA"
      - name: Sign and verify the candidate
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_CHAIN" || { echo 'Configure CERTIFICATE_CHAIN in the marketplace environment.' >&2; exit 1; }
          test -n "$PRIVATE_KEY" || { echo 'Configure PRIVATE_KEY in the marketplace environment.' >&2; exit 1; }
          python3 scripts/ci_gradle.py signPlugin verifyPluginSignature \
            -PreleaseArchive="$CANDIDATE_ARCHIVE" --no-build-cache --no-configuration-cache
          python3 scripts/release_manifest.py --commit "$GITHUB_SHA"
      - name: Upload signed release files and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-marketplace-candidate
          path: build/release/
          if-no-files-found: error
      - name: Publish an explicitly requested update
        if: inputs.action == 'publish-update'
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          test -n "$PUBLISH_TOKEN" || { echo 'Configure PUBLISH_TOKEN for an existing Marketplace listing.' >&2; exit 1; }
          python3 scripts/ci_gradle.py publishPlugin -PreleaseArchive="$CANDIDATE_ARCHIVE" \
            --no-build-cache --no-configuration-cache
